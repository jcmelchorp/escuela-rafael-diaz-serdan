<table class="w-100" mat-table [dataSource]="dataSource">
  <ng-container [matColumnDef]="column.propertyName" *ngFor="let column of columnsToDisplay; let i = index">
    <th mat-header-cell *matHeaderCellDef>
      <button mat-button [disabled]="!groupByColumns.includes(column.propertyName)"
        color="{{groupByColumns.includes(column.propertyName)?'primary':'default'}}" (click)="groupByColumns.includes(column.propertyName)
            ? unGroupBy($event, column)
            : groupBy($event, column)">
        {{ column.headerText }}
      </button>
    </th>
    <div [ngSwitch]="column.propertyName">
      <div *ngSwitchCase="'cycle'">
        <td mat-cell *matCellDef="let row"> </td>
      </div>
      <div *ngSwitchCase="'grade'">
        <td mat-cell *matCellDef="let row">{{levels[row[column.propertyName]]}} </td>
      </div>
      <div *ngSwitchDefault>
        <td mat-cell *matCellDef="let row"> {{row[column.propertyName]}}</td>
      </div>
    </div>
  </ng-container>

  <ng-container matColumnDef="noData">
    <tr class="d-block" mat-footer-cell *matFooterCellDef [attr.colspan]="displayedColumns.length">
      <div fxLayout="column" fxLayoutAlign="center center">
        <h2 class="text-black-50">Aún no hay elementos en esta lista.</h2>
      </div>
    </tr>
  </ng-container>

  <ng-container matColumnDef="groupHeader">
    <td mat-cell class="mat-h{{4-group.level}} border-bottom-0 px-{{group.level+3}}"
      [attr.colspan]="displayedColumns.length" *matCellDef="let group">
      <strong>{{ group.level===1?cycles[group[groupByColumns[group.level - 1]]]:[group[groupByColumns[group.level -
        1]]]}} </strong>
      ({{group.totalCounts}})
      <mat-icon>{{
        group.expanded ? "expand_more" : "chevron_right"
        }}</mat-icon>
    </td>
  </ng-container>
  <th mat-header-row *matHeaderRowDef="displayedColumns"></th>
  <tr mat-row (click)="showClassroom(row.id)" *matRowDef="let row; columns: displayedColumns;"></tr>
  <tr mat-footer-row *matFooterRowDef="['noData']" [hidden]="dataSource.data.length>0"></tr>
  <tr mat-row *matRowDef="let row; columns: ['groupHeader']; when: isTableGroup" (click)="groupHeaderClick(row)">
  </tr>
</table>
