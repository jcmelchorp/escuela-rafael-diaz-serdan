<div fxLayout="row" fxLayout="stretch center" fxLayoutGap="10px">
  <mat-list class="drag-and-drop-list" cdkDropList #courseList="cdkDropList" [cdkDropListData]="classroom.coursesIds"
    (cdkDropListDropped)="dropCourses($event)" dense>
    <h3 matSubheader>Materias</h3>
    <mat-list-item *ngIf="(!classroom.coursesIds||classroom.coursesIds.length<1)" mat-icon-button
      (click)="assignCoursesToClassroom(classroom)">
      <mat-icon>sync alt</mat-icon>
    </mat-list-item>
    <div>Las materias apareceran asignadas en este orden.</div>
    <app-school-course class="drag-and-drop-box" cdkDrag [course]="course" *ngFor="let course of classroom.courses">
    </app-school-course>
  </mat-list>
  <mat-list class="drag-and-drop-list" cdkDropList #studentList="cdkDropList"
    [cdkDropListData]="classroom.studentsEmails" (cdkDropListDropped)="dropStudents($event)" dense>
    <h3 matSubheader>Alumnos</h3>
    <mat-list-item *ngIf="(!classroom.studentsEmails||classroom.studentsEmails.length<1)">
      <mat-icon matListIcon mat-button-icon (click)="lookForStudents(classroom)">search</mat-icon>
      <div matLine>No hay alumnos
        en este grupo
      </div>
    </mat-list-item>
    <app-school-student class="drag-and-drop-box" cdkDrag *ngFor="let student of classroom.students;let i = index"
      [student]="student" [priority]="i+1">
      <mat-icon matListIcon class="text-danger" (click)="removeStudent(student,i)" name="removeStudent">delete
      </mat-icon>
    </app-school-student>

  </mat-list>
</div>
<ng-template #spinner>
  <div style="min-height: 300px;" fxLayout="column" fxLayoutAlign="center center">
    <mat-spinner strokeWidth="5" [diameter]="50">
    </mat-spinner>
    <span>Buscando ...</span><br>
  </div>
</ng-template>
