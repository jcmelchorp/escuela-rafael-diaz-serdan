<div fxLayout="row" fxLayout="stretch center" fxLayoutGap="10px">
  <mat-list class="drag-and-drop-list" cdkDropList #courseList="cdkDropList" [cdkDropListData]="coursesIds"
    (cdkDropListDropped)="dropCourses($event)" dense>
    <h3 matSubheader>Materias</h3>
    <mat-list-item *ngIf="(!coursesIds||coursesIds.length<1)" mat-icon-button
      (click)="assignCoursesToClassroom(classroom)">
      <mat-icon>sync alt</mat-icon>
    </mat-list-item>
    <mat-list-item class="drag-and-drop-box" cdkDrag *ngFor="let course of classroom.courses;let j = index"
      [attr.data-index]="j">
      <div mat-line>{{j+1}}. {{course.name}}</div>
    </mat-list-item>
  </mat-list>
  <mat-list class="drag-and-drop-list" cdkDropList #studentList="cdkDropList" [cdkDropListData]="studentsEmails"
    (cdkDropListDropped)="dropStudents($event)" dense>
    <h3 matSubheader>Alumnos</h3>
    <mat-list-item *ngIf="(!studentsEmails||studentsEmails.length<1)">
      <mat-icon matListIcon mat-button-icon (click)="lookForStudents(classroom)">search</mat-icon>
      <div matLine>No hay alumnos
        en este grupo
      </div>
    </mat-list-item>
    <mat-list-item class="drag-and-drop-box" cdkDrag *ngFor="let student of students;let i = index">
      <!--       <mat-icon matListIcon cdkDragHandle class="handle">drag_indicator</mat-icon>-->
      <div matLine>{{i+1}}. {{student.name.fullName}}</div>
    </mat-list-item>

  </mat-list>
</div>
