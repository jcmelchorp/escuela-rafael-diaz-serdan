<form [formGroup]="filterValues">
  <div fxLayout="row wrap" fxLayout.lt-md="column" fxLayoutGap="5px">
    <mat-form-field appearance="outline" fxFlex="1 0 calc(33.3% - 5px)">
      <mat-label>Nombre</mat-label>
      <input matInput type="text" formControlName="name" placeholder="Buscar por nombre">
      <button mat-icon-button matSuffix (click)="filterValues.controls.name.reset();$event.stopPropagation()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
    <mat-form-field appearance="outline" fxFlex="1 0 calc(33.3% - 5px)">
      <mat-label>Grado escolar</mat-label>
      <mat-select formControlName="grade" placeholder="Selecciona un grado">
        <mat-option [value]="">Todos los grados</mat-option>
        <mat-option *ngFor="let key of gradeKeys" [value]="key">
          {{key}}
        </mat-option>
      </mat-select>
      <button mat-icon-button matSuffix (click)="filterValues.controls.grade.reset();$event.stopPropagation()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>
</form>
<mat-list>
  <mat-list-item>Choose a column</mat-list-item>
  <mat-list-item>
    <mat-select placeholder="Group by" [(ngModel)]="groupingColumn" name="item" (ngModelChange)="buildDataSource()">
      <mat-option [value]="null"></mat-option>
      <mat-option *ngFor="let item of displayedColumns" [value]="item">
        {{item}}
      </mat-option>
    </mat-select>
  </mat-list-item>
</mat-list>
<table mat-table [dataSource]="dataSource">
  <!--- Note that these columns can be defined in any order.
      The actual rendered columns are set as a property on the row definition" -->
  <ng-container *ngFor="let col of displayedColumns" [matColumnDef]="col">
    <th mat-header-cell *matHeaderCellDef>{{ col }}</th>
    <td mat-cell *matCellDef="let row">{{ row[col] }}</td>
  </ng-container>

  <!-- Default Table lines -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <!-- Group header cells-->
  <ng-container matColumnDef="groupHeader">
    <td colspan="999" mat-cell *matCellDef="let group">
      <strong>{{group.groupName}}</strong>
    </td>
  </ng-container>
  <ng-container matColumnDef="groupReducer">
    <td colspan="1" mat-cell *matCellDef="let group">
      <div fxFill fxLayoutAlign="center center">
        <mat-icon *ngIf="!group.reduced">expand_less</mat-icon>
        <mat-icon *ngIf="group.reduced">expand_more</mat-icon>
      </div>
    </td>
  </ng-container>

  <!-- Group line -->
  <tr mat-row class="clickable" *matRowDef="let row; columns: ['groupReducer','groupHeader']; when: isGroup"
    (click)="reduceGroup(row)">
  </tr>

</table>
