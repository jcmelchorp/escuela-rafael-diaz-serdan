<div class="mat-elevation-z8">
  <button mat-raised-button (click)="addCycle()">
    <mat-icon>add</mat-icon>
    <span>Add Cycle</span>
  </button>
  <ng-template #spinner>
    <app-spinner [spinnerText]="'Buscando...'"></app-spinner>
  </ng-template>
  <table *ngIf="!(loading$|async)&&(loaded$|async)&&cycles$|async;else spinner" mat-table class="full-width-table"
    matSort aria-label="Elements">
    <!-- Id Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
      <td mat-cell *matCellDef="let row">{{row.id}}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Label</th>
      <td mat-cell *matCellDef="let row">{{row.label}}</td>
    </ng-container>

    <!-- isCurrentDefault Column -->
    <ng-container matColumnDef="isCurrentDefault">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>isCurrentDefault</th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox [checked]="row.isCurrentDefault" [(indeterminate)]="indeterminate" [labelPosition]="labelPosition"
          [disabled]="disabled" (change)="updateDefaultCycle({id:row.id,isCurrentDefault:$event.checked})">
        </mat-checkbox>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator #paginator [length]="dataSource?.data?.length" [pageIndex]="0" [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]" aria-label="Select page">
  </mat-paginator>
</div>
