<mat-table matSort>
  <ng-container *ngFor="let column of columns; let i = index" matColumnDef="{{ column.field }}">
    <mat-header-cell *matHeaderCellDef>
      <button mat-button [disabled]="column.field=='priority'||column.field=='name'||column.field=='teacherId'"
        color="{{groupByColumns.includes(column.field)?'primary':'default'}}" (click)="groupByColumns.includes(column.field)
            ? unGroupBy($event, column)
            : groupBy($event, column)">
        {{ column.label }}
      </button>
    </mat-header-cell>
    <div [ngSwitch]="column.field">
      <div *ngSwitchCase="column.field==='action'">
        <mat-cell *matCellDef="let row"> </mat-cell>
      </div>
      <div *ngSwitchCase="column.field==='grade'">
        <mat-cell *matCellDef="let row">{{slevels[row[column.field]]}} </mat-cell>
      </div>
      <!--  <div *ngSwitchCase="column.field==='teacherId'">
        <mat-cell *matCellDef="let row">
          <mat-form-field class="d-block" appearance="outline">
            <mat-label>Profesor</mat-label>
            <mat-select [(ngValue)]="teacherId" placeholder="Selecciona el profesor">
              <mat-option *ngFor="let teacher of teachers$|async" [value]="teacher.id">
                <img class="img-select rounded-circle" src="{{teacher.photoUrl}}">&nbsp;
                {{teacher.name.fullName}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </mat-cell>
      </div> -->
      <div *ngSwitchDefault>
        <mat-cell *matCellDef="let row">{{row[column.field]}}</mat-cell>
      </div>
    </div>
  </ng-container>
  <!--  Actions-->
  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef></mat-header-cell>
    <mat-cell *matCellDef="let row" fxLayoutAlign="end center" fxLayoutGap="10px">
      <mat-icon color="accent" mat-icon-button matTooltip="Modifica la información de esta clase"
        (click)="editAssignedCourse(row)">
        edit</mat-icon>
      <mat-icon color="warn" mat-icon-button matTooltip="Elimina esta clase" (click)="deleteAssignedCourse(row)">
        delete
      </mat-icon>
      <!-- <mat-icon *ngIf="!row.teacherId" mat-icon-button matTooltip="Asigna un profesor a esta clase"
        (click)="openTeacherToCourse(row)">
        co_present
      </mat-icon> -->
      <button mat-icon-button matBadge=" {{row.students?.lenght}}" (click)="openStudentsToCourse(row)">
        <mat-icon matTooltip=" Asigna alumnos a esta clase">groups </mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="noData">
    <mat-footer-cell class="bg-gray" *matFooterCellDef [attr.colspan]="displayedColumns.length">
      No se encontraron elementos
    </mat-footer-cell>
  </ng-container>
  <!-- Expanded Content Column - The detail row is made up of this one column -->
  <!--  <ng-container matColumnDef="expandedDetail">
    <mat-cell *matCellDef="let detail">
      The symbol for {{detail.element.name}} is {{detail.element.symbol}}
    </mat-cell>
  </ng-container> -->
  <ng-container matColumnDef="loading">
    <mat-footer-cell *matFooterCellDef [attr.colspan]="displayedColumns.length">
      <div style="display: flex; justify-content: center; align-items: center; background: white;">
        <mat-progress-spinner color="primary" mode="indeterminate">
        </mat-progress-spinner>
      </div>
    </mat-footer-cell>
  </ng-container>

  <!--
  <mat-row *matRowDef="let row; columns: displayedColumns;" matRipple class="element-row"
    [class.expanded]="expandedElement == row" (click)="expandedElement = row"></mat-row>
  <mat-row *matRowDef="let row; columns: ['expandedDetail']; when: isExpansionDetailRow"
    [@detailExpand]="row.element == expandedElement ? 'expanded' : 'collapsed'" style="overflow: hidden">
  </mat-row> -->
  <mat-header-row mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  <mat-footer-row *matFooterRowDef="['noData']" [hidden]="dataSource && dataSource.data.length > 0"></mat-footer-row>
  <mat-footer-row *matFooterRowDef="['loading']" [hidden]="dataSource !== undefined"></mat-footer-row>
  <!-- Group header -->
  <ng-container matColumnDef="groupHeader">
    <mat-cell class="bg-gray border-bottom-0 rounded-3 " [attr.colspan]="displayedColumns.length"
      *matCellDef="let group">
      {{ group[groupByColumns[group.level - 1]] }} ({{group.totalCounts}})
      <mat-icon>{{
        group.expanded ? "expand_more" : "chevron_right"
        }}</mat-icon>
    </mat-cell>
  </ng-container>

  <mat-row *matRowDef="let row; columns: ['groupHeader']; when: isGroup" (click)="groupHeaderClick(row)">
  </mat-row>


</mat-table>
