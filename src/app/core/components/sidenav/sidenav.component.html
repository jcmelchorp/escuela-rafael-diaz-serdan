<mat-sidenav-container class="sidenav-container">
  <mat-sidenav *ngIf="isOnline" #leftSidenav class="sidenav d-print-none" [fixedInViewport]="false"
    [attr.role]="isHandset ? 'dialog' : 'navigation'" [@onSideNavChange]="sideNavState ? 'open' : 'close'"
    [mode]="isHandset ? 'over':'side'" [opened]="isHandset === false">
    <div role="navigation" fxLayout="column" fxLayoutAlign="space-between" fxFlexFill>
      <mat-nav-list dense>
        <mat-list-item [routerLink]="['/']" routerLinkActive="active" (click)="leftSidenav.close()">
          <mat-icon matListIcon>home</mat-icon>
          <span matLine [@animateText]="linkText ? 'show' : 'hide'">Inicio</span>
        </mat-list-item>
        <mat-list-item [routerLink]="['p']" routerLinkActive="active" (click)="leftSidenav.close()">
          <mat-icon matListIcon>school</mat-icon>
          <span matLine [@animateText]="linkText ? 'show' : 'hide'">Alumnos</span>
        </mat-list-item>
        <mat-list-item *ngIf="isTeacher" [routerLink]="['profe']" routerLinkActive="active"
          (click)="leftSidenav.close()">
          <mat-icon matListIcon>co_present</mat-icon>
          <span matLine [@animateText]="linkText ? 'show' : 'hide'">Profesores</span>
        </mat-list-item>
        <mat-list-item *ngIf="isTeacher || isAdmin" [routerLink]="['g']" routerLinkActive="active"
          (click)="leftSidenav.close()">
          <fa-icon matListIcon [icon]="faGoogle"></fa-icon>
          <span matLine [@animateText]="linkText ? 'show' : 'hide'">GSuite</span>
        </mat-list-item>
        <mat-list-item *ngIf="isTeacher || isAdmin" [routerLink]="['e']" routerLinkActive="active"
          (click)="leftSidenav.close()">
          <mat-icon matListIcon>apartment</mat-icon>
          <span matLine [@animateText]="linkText ? 'show' : 'hide'">Dirección</span>
        </mat-list-item>
      </mat-nav-list>
      <mat-nav-list>
        <!-- <h3 matSubheader [@animateText]="linkText ? 'show' : 'hide'">Alumnos</h3> -->
        <mat-accordion>
          <mat-expansion-panel [disabled]="!isAdmin" [class.mat-elevation-z0]="true" (opened)="panelOpenState = true"
            (closed)="panelOpenState = false" hideToggle="panelOpenState">
            <mat-expansion-panel-header>
              <mat-panel-title>
                <mat-icon>admin_panel_settings</mat-icon>
                <span [@animateText]="linkText ? 'show' : 'hide'">&nbsp; Usuarios</span>
              </mat-panel-title>
            </mat-expansion-panel-header>
            <ng-template matExpansionPanelContent>
              <mat-nav-list dense>
                <mat-list-item [routerLink]="['u']" routerLinkActive="active" (click)="leftSidenav.close()">
                  <mat-icon matListIcon>people_alt</mat-icon>
                  <span matLine [@animateText]="linkText ? 'show' : 'hide'">Escuela</span>
                </mat-list-item>
                <mat-list-item [routerLink]="['admin']" routerLinkActive="active" (click)="leftSidenav.close()">
                  <mat-icon matListIcon>domain</mat-icon>
                  <span matLine [@animateText]="linkText ? 'show' : 'hide'">Google</span>
                </mat-list-item>
              </mat-nav-list>
            </ng-template>
          </mat-expansion-panel>
        </mat-accordion>
        <mat-list-item (click)="onSidenavToggle()">
          <fa-icon matListIcon [icon]="sideNavState ? faCompressAlt : faExpandAlt"></fa-icon>
        </mat-list-item>
      </mat-nav-list>
    </div>
  </mat-sidenav>
  <mat-sidenav-content [@onMainContentChange]="(onSideNavChange && !isHandset) ? 'open': 'close'">
    <app-main fxFill [isOnline]="isOnline"></app-main>
    <app-footer class="sticky-bottom"></app-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
