<div class="py-4 text-end school-background" [@flyInOut]="'flyInOut'">
  <p class="view-subtitle">Servicios académicos para estudiantes y profesores.</p>
  <p class="view-title">Bienvenido</p>
</div>
<div class="p-4">
  <div fxLayout="row wrap" fxLayout.lt-sm="column" fxLayoutGap="20px" fxLayoutAlign="flex-start">
    <div *ngFor="let card of cards" fxFlex="0 1 calc(33.33% - 20px)" fxFlex.lt-md="0 1 calc(50% - 20px)"
      fxFlex.lt-sm="100%">
      <mat-card *ngIf="card.access|async" [@flyInOut]="'flyInOut'" class="dashboard-cards" [routerLink]="card.route"
        appMaterialElevation [raisedElevation]="raisedElev">
        <mat-card-header>
          <mat-card-title>{{card.title}}</mat-card-title>
          <mat-card-subtitle>
            <p>{{card.description}}</p>
          </mat-card-subtitle>
        </mat-card-header>
        <img mat-card-image src="{{card.imgUrl}}" />
      </mat-card>
    </div>
  </div>
</div>
