<div class="card">
  <div class="card-body">
    <form [formGroup]="filterValues">
      <div class="position-sticky" fxLayout="row wrap" fxLayout.lt-md="column" fxLayoutGap="5px">
        <mat-form-field appearance="outline" fxFlex="1 0 calc(33.3% - 5px)">
          <mat-label>Nombre</mat-label>
          <input matInput type="text" formControlName="name" placeholder="Buscar por nombre" (keyup)="applyFilter()">
          <button mat-icon-button matSuffix
            (click)="filterValues.controls.name.reset();$event.stopPropagation();applyFilter()">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
        <mat-form-field appearance="outline" fxFlex="1 0 calc(33.3% - 5px)">
          <mat-label>Grado escolar</mat-label>
          <mat-select formControlName="grade" placeholder="Selecciona un grado" (selectionChange)="applyFilter()">
            <mat-option *ngFor="let key of gradeKeys" [value]="key">
              {{key}}
            </mat-option>
          </mat-select>
          <button mat-icon-button matSuffix
            (click)="filterValues.controls.grade.reset();$event.stopPropagation();applyFilter()">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
        <mat-form-field appearance="outline" fxFlex="1 0 calc(33.3% - 5px)">
          <mat-label>Rol de usuario</mat-label>
          <mat-select formControlName="role" placeholder="Selecciona un rol" (selectionChange)="applyFilter()">
            <mat-option *ngFor="let key of roleKeys" [value]="key">
              {{key|titlecase}}
            </mat-option>
          </mat-select>
          <button mat-icon-button matSuffix
            (click)="filterValues.controls.role.reset();$event.stopPropagation();applyFilter()">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>
    </form>
  </div>
  <ng-template #spinner>
    <div style="min-height: 300px;" fxLayout="column" fxLayoutAlign="center center">
      <mat-spinner strokeWidth="10" [diameter]="100">
      </mat-spinner>
      <span>Buscando clases ...</span><br>
    </div>
  </ng-template>
  <table mat-table *ngIf="users$|async" matSort aria-label="Usuarios">
    <!-- Selection Box -->
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox color="primary" (change)="$event ? masterToggle() : null"
          [checked]="selection.hasValue() && isAllSelected()" [aria-label]="checkboxLabel()"
          [indeterminate]="selection.hasValue() && !isAllSelected()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox color="primary" (click)="$event.stopPropagation()"
          (change)="$event ? selection.toggle(row) : null" [aria-label]="checkboxLabel(row)"
          [checked]="selection.isSelected(row)">
        </mat-checkbox>
      </td>
    </ng-container>
    <!-- Badges -->
    <ng-container matColumnDef="badges">
      <th mat-header-cell *matHeaderCellDef>
        <button role="menu" mat-button [hidden]="selection.selected.length<1" [matMenuTriggerFor]="actionsMenu">
          Acciones ( {{selection.selected.length}} ) <mat-icon>expand_more</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row">
        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="5px">
          <mat-icon *ngIf="row.suspended" class="text-danger"
            [matTooltip]="'Usuario suspendido. Los permisos de acceso a los servicios institucionales le han sido revocados.'">
            block</mat-icon>
          <mat-icon *ngIf="!row.isHuman" class="text-info" [matTooltip]="'Cuenta de usuario de la organización'">
            smart_toy</mat-icon>
        </div>
      </td>
    </ng-container>
    <!-- Entity Props -->
    <ng-container [matColumnDef]="column.propertyName" *ngFor="let column of columnsToDisplay">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> {{column.headerText}} </th>
      <td mat-cell *matCellDef="let row">
        {{(column.propertyName=='givenName'||column.propertyName=='familyName')
        ? row.name[column.propertyName]
        : row[column.propertyName]|titlecase}}
      </td>
    </ng-container>
    <!-- Actions-->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let row">
        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="5px">
          <button [matTooltip]="'Cuenta de Usuario'" class="color-rds" mat-icon-button (click)="onEditUser(row)">
            <mat-icon>edit_outlined</mat-icon>
          </button>
          <button [matTooltip]="'Datos personales'" class="color-rds" mat-icon-button [routerLink]="['edit']"
            [queryParams]="{id:row.id}">
            <mat-icon>perm_contact_calendar</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
    <!-- Render rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
    <!-- <tr mat-row *matRowDef="let row; columns: displayedColumns;" [routerLink]="['edit']" [queryParams]="{id:row.id}"
      [class.users-row-is-clicked]="selection.isSelected(row)"></tr> -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
      [class.users-row-is-clicked]="selection.isSelected(row)"></tr>
    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" colspan="7">No se encontraron resultados</td>
    </tr>
  </table>

  <mat-paginator #paginator [length]="dataSource?.data?.length" [pageIndex]="0" [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20, 50, 100]" showFirstLastButtons>
  </mat-paginator>
</div>
<mat-menu #actionsMenu="matMenu">
  <ng-template matMenuContent>
    <button mat-menu-item (click)="groupMany(selection)">Cambiar Grupo</button>
    <button mat-menu-item (click)="suspendMany(selection)">Suspender</button>
    <button mat-menu-item (click)="deleteMany(selection)">Eliminar</button>
  </ng-template>
</mat-menu>
