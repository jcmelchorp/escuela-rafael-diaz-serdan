<div class="p-4">
  <p class="view-title">Usuarios</p>
  <p class="view-subtitle">Cuentas de usuarios.</p>
  <div class="card">
    <div class="card-body">
      <form [formGroup]="filterValues">
        <div class="position-sticky" fxLayout="row wrap" fxLayout.lt-md="column" fxLayoutGap="5px">
          <mat-form-field appearance="outline" fxFlex="1 0 calc(33.3% - 5px)">
            <mat-label>Nombre</mat-label>
            <input matInput type="text" formControlName="name" placeholder="Buscar por nombre">
            <button mat-icon-button matSuffix (click)="filterValues.controls.name.reset();$event.stopPropagation()">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
          <mat-form-field appearance="outline" fxFlex="1 0 calc(33.3% - 5px)">
            <mat-label>Grado escolar</mat-label>
            <mat-select formControlName="grade" placeholder="Selecciona un grado">
              <mat-option *ngFor="let key of gradeKeys" [value]="key">
                {{key}}
              </mat-option>
            </mat-select>
            <button mat-icon-button matSuffix (click)="filterValues.controls.grade.reset();$event.stopPropagation()">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
          <mat-form-field appearance="outline" fxFlex="1 0 calc(33.3% - 5px)">
            <mat-label>Rol de usuario</mat-label>
            <mat-select formControlName="role" placeholder="Selecciona un rol">
              <mat-option *ngFor="let key of roleKeys" [value]="key">
                {{key|titlecase}}
              </mat-option>
            </mat-select>
            <button mat-icon-button matSuffix (click)="filterValues.controls.role.reset();$event.stopPropagation()">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
        </div>
      </form>
    </div>
    <ng-template #spinner>
      <div style="min-height: 300px;" fxLayout="column" fxLayoutAlign="center center">
        <mat-spinner strokeWidth="10" [diameter]="100">
        </mat-spinner>
        <span>Buscando clases ...</span><br>
      </div>
    </ng-template>
    <mat-tab-group *ngIf="(filteredEntities$|async) as filteredEntities;else spinner" mat-stretch-tabs
      class="example-stretched-tabs">
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon>table_rows</mat-icon>
          Tabla
        </ng-template>
        <app-accounts-table [data]="filteredEntities"></app-accounts-table>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon>list</mat-icon>
          Lista
        </ng-template>
        <app-accounts-list [data]="filteredEntities"></app-accounts-list>
      </mat-tab>
    </mat-tab-group>
    <!--   <nav mat-tab-nav-bar [backgroundColor]="background" mat-align-tabs="center">
      <a mat-tab-link [routerLink]="[link]" *ngFor="let link of links" (click)="activeLink = link"
        [active]="activeLink == link"> {{link|titlecase}}
      </a>
    </nav>
    <router-outlet></router-outlet> -->
  </div>
</div>
<button class="mat-fab-bottom-right mat-elevation-z8" mat-fab color="primary" matTooltip="Nuevo usuario"
  (click)="onCreateUser()">
  <mat-icon class="icon">person_add</mat-icon>
</button>
