<div matDialogTitle fxLayout="row wrap" fxLayoutAlign="space-between">
  <h2 class="color-rds">Usuario de Google</h2>
  <fa-icon class="text-secondary" matDialogClose mat-icon-button [icon]="faTimes" (click)="close()"></fa-icon>
</div>
<form [formGroup]="saveForm" (ngSubmit)="onSubmit()" novalidate>
  <mat-dialog-content>
    <div fxLayout="row wrap" fxLayout.lt-md="column" fxLayoutGap="5px">
      <mat-form-field fxFlex="0 1 calc(50% - 5px)" appearance="outline">
        <mat-label>Nombre(s)</mat-label>
        <input matInput type="text" formControlName="givenName">
      </mat-form-field>
      <mat-form-field fxFlex="0 1 calc(50% - 5px)" appearance="outline">
        <mat-label>Apellido(s)</mat-label>
        <input matInput type="text" formControlName="familyName">
      </mat-form-field>
    </div>
    <div fxLayout="row wrap" fxLayout.lt-md="column" fxLayoutGap="5px">
      <mat-form-field fxFlex="0 1 calc(50% - 5px)" appearance="outline">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="text" formControlName="primaryEmail">
      </mat-form-field>
      <mat-form-field fxFlex="0 1 calc(50% - 5px)" appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
        <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-stroked-button color="warn" (click)="close()" [matDialogClose]="">Cancelar</button>
    <button mat-stroked-button color="primary" type="submit" [disabled]="saveForm.valid || !(this.loading$|async)">Crear
      en Google</button>
  </mat-dialog-actions>
</form>
