<ng-template #spinner>
  <div style="min-height: 300px;" fxLayout="column" fxLayoutAlign="center center">
    <mat-spinner strokeWidth="3" [diameter]="50">
    </mat-spinner>
    <span>Buscando ...</span><br>
  </div>
</ng-template>
<div *ngIf="(user$|async) as user;else spinner">
  <!--  <div>{{user.currentGrades|json}}</div> -->
  <div class="card bg-transparent">
    <h2 class="card-header" fxLayout="row wrap" fxLayoutAlign="space-between start">
      <div>
        <span>Calificaciones&nbsp;&nbsp;
          <small class="font-weight-light">Ciclo escolar{{user.currentGrades.cycle}} </small>
        </span>
      </div>
      <div>{{today|date:'medium'}}</div>
    </h2>
    <div class="float-right">
      <button mat-button (click)="printPage()">
        <mat-icon class="rds-icon">print</mat-icon>&nbsp;Imprimir
      </button>
      <button mat-button (click)="generatePdf()">
        <fa-icon class="rds-icon" [icon]="faFilePdf" size="lg"></fa-icon>&nbsp;Descargar
      </button>
    </div>
    <div class="card-body">
      <app-profile-scores-table *ngIf="user.level!='Preescolar'" [data]="user.currentGrades"></app-profile-scores-table>
      <app-profile-scores-list *ngIf="user.level=='Preescolar'" [data]="user.currentGrades"></app-profile-scores-list>
    </div>
    <div *ngIf="user.level!='Preescolar'" class="card-footer ">
      <h3 class="text-center">Recomendaciones</h3>
      <app-profile-scores-recomendation [data]="user.currentGrades.notes"></app-profile-scores-recomendation>
      <h3 class="text-center d-print-none">Estadísticas</h3>
      <app-profile-scores-bar-chart class="d-print-none" [data]="user.currentGrades.scores">
      </app-profile-scores-bar-chart>
    </div>
    <!--  <div *ngIf="user.level=='Preescolar'" class="card-footer ">
      <h3 class="text-center">Recomendaciones</h3>
      <app-profile-scores-recomendation [data]="user.currentGrades.notes"></app-profile-scores-recomendation>
    </div> -->
  </div>
</div>
<div *ngIf="(isTeacher$|async)">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <span class="text-warning"> Por el momento, las calificaciones son de acceso a los alumnos.</span>
      </mat-card-title>
    </mat-card-header>
  </mat-card>
</div>
